<style type="text/css">

/*@import url('https://fonts.googleapis.com/css?family=Nunito');*/
@import url('https://fonts.googleapis.com/css?family=Roboto+Condensed:700');

body {
  margin: 0px;
  background-color: rgba(0,0,0,.1);
  /*font-family: Nunito;*/
  font-family: 'Roboto Condensed', sans-serif;
}

/*
  GLUANT EFX
*/
.lavalamp, .lavalamp div {
  position: absolute;
  display: block;
  pointer-events: none;
}
.lavalamp {
  height: 300px;
  width: 100px;
  left: 50%;
  top: 50%;
  border-radius: 100%;
  transform: translate(-50%, -50%);
}
.lavalamp .lavalamp_content {
  height: 100%;
  width: 100%;
  left: 0px;
  top: 0px;
  border-radius: inherit;
  overflow: hidden;
}
.lavalamp .lavalamp_content .lavalamp_bulles {
  height: auto;
  width: 100%;
  left: 0px;
  top: -70px;
  bottom: -70px;
  filter:url("#gluant_efx");
}
.lavalamp .lavalamp_content .lavalamp_bulles:after,
.lavalamp .lavalamp_content .lavalamp_bulles:before {
  position: absolute;
  display: block;
  content: ' ';
  height: 80px;
  width: 140%;
  left: -20%;
  border-radius: 50%;
}
.lavalamp .lavalamp_content .lavalamp_bulles:after { top: -7px; }
.lavalamp .lavalamp_content .lavalamp_bulles:before { bottom: 0px; }
/* BULLES */
.lavalamp .lavalamp_content .lavalamp_bulles .bulle {
  height: 100%;
  width: 100%;
  left: 0px;
  top: 0px;
}
.lavalamp .lavalamp_content .lavalamp_bulles .bulle div {
  position: absolute;
  content: ' ';
  height: 0px;
  width: 0px;
  padding: 30%;
  border-radius: 50%;
  pointer-events: auto;
  transition: .1s;
}
.lavalamp .lavalamp_content .lavalamp_bulles .bulle.top, .lavalamp .lavalamp_content .lavalamp_bulles .bulle.top div { top: 0px; }
.lavalamp .lavalamp_content .lavalamp_bulles .bulle.bottom, .lavalamp .lavalamp_content .lavalamp_bulles .bulle.bottom div { bottom: 0px; }
/* SIZES */
.lavalamp .lavalamp_content .lavalamp_bulles .bulle:nth-child(1) div { padding: 30%; }
.lavalamp .lavalamp_content .lavalamp_bulles .bulle:nth-child(2) div { padding: 40%; }
.lavalamp .lavalamp_content .lavalamp_bulles .bulle:nth-child(3) div { padding: 25%; }
.lavalamp .lavalamp_content .lavalamp_bulles .bulle:nth-child(4) div { padding: 35%; }
/* COLOR DEFAULT */
.lavalamp .lavalamp_content { background-color: #fff; }
.lavalamp .lavalamp_content .lavalamp_bulles:after,
.lavalamp .lavalamp_content .lavalamp_bulles:before,
.lavalamp .lavalamp_content .lavalamp_bulles .bulle div { background-color: #60696e; }


/*
  ANIMATION
*/
.lavalamp.anim .bulle:nth-child(1) { animation: anim_bulle_1 21s ease-in infinite; }
.lavalamp.anim .bulle:nth-child(2) { animation: anim_bulle_2 27s ease-in infinite; }
.lavalamp.anim .bulle:nth-child(3) { animation: anim_bulle_3 24s ease-in infinite; }
.lavalamp.anim .bulle:nth-child(4) { animation: anim_bulle_4 18s ease-in infinite; }
.lavalamp.anim .bulle.top { animation-timing-function: cubic-bezier(0.47, 0, 0.745, 0.715); }
.lavalamp.anim .bulle.bottom { animation-timing-function: cubic-bezier(0.39, 0.575, 0.565, 1); }
/**/
@keyframes anim_bulle_1 {
  0% { transform: translate(0px, 0px); }
  50% { transform: translate(20px, 100%); }
}
@keyframes anim_bulle_2 {
  0% { transform: translate(0px, 0px); }
  50% { transform: translate(0px, -100%); }
}
@keyframes anim_bulle_3 {
  50% { transform: translate(0px, 0px); }
  100% { transform: translate(20px, 100%); }
}
@keyframes anim_bulle_4 {
  50% { transform: translate(0px, 0px); }
  100% { transform: translate(0px, -100%); }
}


/* ANIM FORME BULLES */
.lavalamp.anim_forme .lavalamp_content .lavalamp_bulles .bulle div:after {
  position: absolute;
  display: block;
  content: ' ';
  height: 80%;
  width: 80%;
  left: 10%;
  top: 10%;
  border-radius: 50%;
  background: inherit;
  background-color: inherit;
  filter: blur(5px);
}
.lavalamp.anim.anim_forme .lavalamp_content .lavalamp_bulles .bulle:nth-child(1) div:after { animation: anim_forme_bulle_1 5s infinite alternate; }
.lavalamp.anim.anim_forme .lavalamp_content .lavalamp_bulles .bulle:nth-child(2) div:after { animation: anim_forme_bulle_2 5s infinite alternate; }
.lavalamp.anim.anim_forme .lavalamp_content .lavalamp_bulles .bulle:nth-child(3) div:after { animation: anim_forme_bulle_1 5s infinite alternate; }
.lavalamp.anim.anim_forme .lavalamp_content .lavalamp_bulles .bulle:nth-child(4) div:after { animation: anim_forme_bulle_2 5s infinite alternate; }
/**/
@keyframes anim_forme_bulle_1 {
  0% { transform: translate(15%, 15%); }
  50% { transform: translate(0%, 0%) scaleY(1.5); }
  100% { transform: translate(-15%, -15%); }
}
@keyframes anim_forme_bulle_2 {
  0% { transform: translate(8%, -15%); }
  100% { transform: translate(5%, 20%); }
}

</style>

<style type="text/css">

/* CHAPEAU & SOCLE */
.lavalamp.socle:before {
  position: absolute;
  display: block;
  content: ' ';
  height: 10%;
  width: 80%;
  left: 10%;
  top: 95%;
  border-radius: 50%;
  background-image: linear-gradient(315deg, #2f4353 0%, #d2ccc4 94%);
}
.lavalamp.socle .lavalamp_content:after,
.lavalamp.socle .lavalamp_content:before {
  position: absolute;
  display: block;
  content: ' ';
  height: 24%;
  width: 100%;
  left: 0px;
  border-radius: 50%;
  background-color: #2f4353;
  background-image: linear-gradient(315deg, #2f4353 0%, #d2ccc4 94%);
  z-index: 10;
}
.lavalamp.socle .lavalamp_content:before { top: -8%; }
.lavalamp.socle .lavalamp_content:after {   bottom: -8%; }
.lavalamp.socle .lavalamp_content .lavalamp_bulles:after,
.lavalamp.socle .lavalamp_content .lavalamp_bulles:before { width: 100%; left: 0%; }
.lavalamp.socle .lavalamp_content .lavalamp_bulles:after { top: 40px; }
.lavalamp.socle .lavalamp_content .lavalamp_bulles:before { bottom: 40px; }


/* backgrounds */
.lavalamp:before {
  position: fixed;
  display: block;
  content: ' ';
  height: 100%;
  width: 100%;
  left: 0px;
  top: 0px;
}
.lavalamp.bg_red:before { background-color: red; }
.lavalamp.bg_green:before { background-color: green; }
.lavalamp.bg_blue:before { background-color: blue; }
.lavalamp.bg_fff:before { background-color: #fff; }
.lavalamp.bg_000:before { background-color: #000; }
.lavalamp.bg_111:before { background-color: #111; }
.lavalamp.bg_222:before { background-color: #222; }
.lavalamp.bg_333:before { background-color: #333; }
.lavalamp.bg_444:before { background-color: #444; }
.lavalamp.bg_555:before { background-color: #555; }
.lavalamp.bg_666:before { background-color: #666; }
.lavalamp.bg_777:before { background-color: #777; }
.lavalamp.bg_888:before { background-color: #888; }
.lavalamp.bg_999:before { background-color: #999; }
.lavalamp.bg_ececec:before { background-color: #ececec; }


</style>

<script>
var couleurMax;
var couleurMin;
var ramdomCouleurs = 0;

function initCouleurs() {
  //ramdomCouleurs = Math.floor((Math.random() * 60) / 10);
  if(ramdomCouleurs == 0) {
    couleurMax = [0, 255, 0];
    couleurMin = [0, 255, 100];
  }
  else if(ramdomCouleurs == 1) {
    couleurMax = [100, 256, 256];
    couleurMin = [0, 150, 256];
  }

  else if(ramdomCouleurs == 2) {
    couleurMax = [0, 100, 50];
    couleurMin = [10, 20, 100];
  }
  else if(ramdomCouleurs == 3) {
    couleurMax = [100, 20, 250];
    couleurMin = [100, 10, 50];
  }
  else if(ramdomCouleurs == 4) {
    couleurMax = [255, 110, 150];
    couleurMin = [10, 20, 10];
  }

  else {
    couleurMax = [255, 255, 150];
    couleurMin = [100, 20, 20];
  }
  ramdomCouleurs++
  if(ramdomCouleurs >= 6) { ramdomCouleurs = 0; }
}

/**/
var canvas = document.getElementsByTagName('canvas')[0],
    ctx = null,
    grad = null,
    grad2 = null,
    body = document.getElementsByTagName('body')[0],
    color = [Math.abs(couleurMin[0]-couleurMax[0]), Math.abs(couleurMin[1]-couleurMax[1]), Math.abs(couleurMin[2]-couleurMax[2])];

if (canvas.getContext('2d')) {
  ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 600, 600);
  ctx.save();

  var yColorR = ~~couleurMin[0];
  var xColorV = ~~couleurMin[1];
  var xColorB = ~~couleurMin[2];

  grad = ctx.createRadialGradient(0,0,0,0,0,800);
  grad.addColorStop(0, 'rgb(' + couleurMin[0] + ', ' + couleurMin[1] + ', ' + couleurMin[2] + ')');
  grad.addColorStop(1, 'rgba(' + (couleurMin[0]) + ', ' + (256-couleurMin[1]) + ', ' + (256-couleurMin[2]) + ', .2)');
  //grad.addColorStop(0, 'rgb(' + Math.round(color[0]/2) + ', ' + Math.round(color[1]/2) + ', ' + Math.round(color[2]/2) + ')');
  //grad.addColorStop(1, '#000');


  ctx.fillStyle = grad;
  ctx.fillRect(0,0,600,600);
  ctx.save();

  body.onmousemove = function (event) {
    var width = window.innerWidth,
        height = window.innerHeight,
        x = event.clientX,
        y = event.clientY,
        rx = 600 * x / width,
        ry = 600 * y / height;

    var xc = ~~(256 * x / width);
    var yc = ~~(256 * y / height);

  ctx.clearRect(0, 0, 600, 600);
  ctx.save();
  var xColorR = ~~(color[0] * x / width) + couleurMin[0];
  var yColorR = ~~(color[0] * y / height) + couleurMin[0];
  var xColorV = ~~(color[1] * x / width) + couleurMin[1];// alert(couleurMin[1])
  var yColorV = ~~(color[1] * y / height) + couleurMin[1];
  var xColorB = ~~(color[2] * x / width) + couleurMin[2];
  var yColorB = ~~(color[2] * y / height) + couleurMin[2];

    grad = ctx.createRadialGradient(rx, ry, 0, rx, ry, 800);
  grad.addColorStop(0, 'rgb(' + yColorR + ', ' + xColorV + ', ' + xColorB + ')');
  grad.addColorStop(1, 'rgba(' + yColorR + ', ' + (256-yColorV) + ', ' + (256-yColorB) + ', .2)');
    //grad.addColorStop(1, '#000');
    //grad.addColorStop(1, ['rgb(', yc, ', ', (255 - xc), ', ', (255-yc), ')'].join(''));     //  inversé
    //grad.addColorStop(1, ['rgb(', 255, ', ', 255, ', ', yc, ')'].join(''));

    ctx.fillStyle = grad;
    ctx.fillRect(0,0,600,600);
  //ctx.save();

  };
};


document.body.onclick = function() { initCouleurs(); };
// initCouleurs();

</script>
