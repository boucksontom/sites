.container {
  position: relative;
  height: 400px;
  width: 400px;
  transform: scale(1) rotate(0deg);
  transition: 1s;
/*  --path: '';*/

  position: absolute;
  left: 100%;
  top: 50%;
  transform: translate(-50%, -50%) scale(1) rotate(0deg);
}

.container .spirals {
  position: absolute;
  height: 100%;
  width: 100%;
  left: 0;
  top: 0;
  pointer-events: none;
}
.container .spirals.spiral-month {
  transform: rotate(180deg);
}
.container .spirals.spiral-day {
  transform: rotate(0deg);
}

.container .spirals .onpath {
  position: absolute;
  left: 0;
  top: 0;
  offset-path: var(--path);
  offset-distance: var(--offsetDistance);
  transform: scale(1) rotate(0deg);
  transition: all 1s, background .1s, color .1s;
  pointer-events: all;
  opacity: 1;
}

/* DAYS  */
.onpath.day {
  display: flex;
  height: 34px;
  width: 34px;
  color: #fff;
  font-size: 14px;
  border-radius: 10px;
  align-items: center;
  justify-content: center;
  background-color: #1b6988;
  cursor: pointer;
}
.onpath.day:hover {
  background-color: red;
  z-index: 1;
}

/* MONTHS */
.months .onpath.month {
  font-size: 28px;
  cursor: pointer;
}
.months:hover .onpath.month {
  color: red;
}

<script type="text/javascript">

function lineIntersection (m1, b1, m2, b2) {
    if (m1 === m2) {
        throw new Error("parallel slopes");
    }
    const x = (b2 - b1) / (m1 - m2);
    return {x: x, y: m1 * x + b1};
}

function pStr (point) {
  return `${point.x},${point.y} `;
}

function getPath (center, startRadius, spacePerLoop, startTheta, endTheta, thetaStep) {
    // Rename spiral parameters for the formula r = a + bθ
    const a = startRadius;  // start distance from center
    const b = spacePerLoop / Math.PI / 2; // space between each loop

    // convert angles to radians
    let oldTheta = newTheta = startTheta * Math.PI / 180;
    endTheta = endTheta * Math.PI / 180;
    thetaStep = thetaStep * Math.PI / 180;

    // radii
    let oldR,
        newR = a + b * newTheta;

    // start and end points
    const oldPoint = {x: 0, y: 0};
    const newPoint = {
        x: center.x + newR * Math.cos(newTheta), 
        y: center.y + newR * Math.sin(newTheta)
    };

    // slopes of tangents
    let oldslope,
        newSlope = (b * Math.sin(oldTheta) + (a + b * newTheta) * Math.cos(oldTheta)) /
                   (b * Math.cos(oldTheta) - (a + b * newTheta) * Math.sin(oldTheta));

    let path = "M " + pStr(newPoint);
    
    while (oldTheta < endTheta - thetaStep) {
        oldTheta = newTheta;
        newTheta += thetaStep;

        oldR = newR;
        newR = a + b * newTheta;

        oldPoint.x = newPoint.x;
        oldPoint.y = newPoint.y;
        newPoint.x = center.x + newR * Math.cos(newTheta);
        newPoint.y = center.y + newR * Math.sin(newTheta);

        // Slope calculation with the formula:
        // (b * sinΘ + (a + bΘ) * cosΘ) / (b * cosΘ - (a + bΘ) * sinΘ)
        const aPlusBTheta = a + b * newTheta;

        oldSlope = newSlope;
        newSlope = (b * Math.sin(newTheta) + aPlusBTheta * Math.cos(newTheta)) /
                   (b * Math.cos(newTheta) - aPlusBTheta * Math.sin(newTheta));

        const oldIntercept = -(oldSlope * oldR * Math.cos(oldTheta) - oldR * Math.sin(oldTheta));
        const newIntercept = -(newSlope * newR* Math.cos(newTheta) - newR * Math.sin(newTheta));

        const controlPoint = lineIntersection(oldSlope, oldIntercept, newSlope, newIntercept);

        // Offset the control point by the center offset.
        controlPoint.x += center.x;
        controlPoint.y += center.y;

        path += "Q " + pStr(controlPoint) + pStr(newPoint);
    }
    
    return path;
}

const path1 = getPath({ x: 200, y: 200 }, 30, 83, 5, 2 * 360, 10);
const path1b = getPath({ x: 200, y: 200 }, 30, 83, 645, 2.5 * 360, 10);
const pathYears = getPath({ x: 200, y: 200 }, 30, 83, 5, 1.76 * 360, 10);


class buildValue {
  constructor (params = {}) {
    this.x = 0
    this.params = {...{
        container: params.container,
        parentClass: undefined,
        letterSpacing: 0,
        class: undefined,
        splitWords: true,
        path: undefined,
        wordSpacing: 5,
        content: [],
        rotate: 0,
      }, ...params
    }
    this.init()
  }

  init () { 
    this.params.container.setAttribute("style", "--path: path('" + this.params.path + "'); " + (this.params.rotate ? 'transform: rotate(' + this.params.rotate + 'deg);' : '') + "")
    let n = 0

    this.params.content.forEach((v, k) => {
      let div = document.createElement('div')
      if (v.id) div.setAttribute('id', v.id)
      if (this.params.parentClass) div.className = this.params.parentClass
      document.body.appendChild(div)

      if (this.params.splitWords) {
        let charts = typeof v == 'string' ? v.split('') : v.label.split('')
        charts.forEach((chart, i) => {
          n++
          let divChart = document.createElement('span')
          divChart.innerHTML = chart
          div.appendChild(divChart)
          divChart.className = 'onpath' + (this.params.class ? ' ' + this.params.class : '')
          divChart.style.cssText = 'offset-path: none;'
          let chartWidth = divChart.getBoundingClientRect().width * .5

          this.x += chartWidth
          divChart.style.cssText = '--offsetDistance: ' + this.x + 'px; --chartId: ' + n + ';'
          this.x += chartWidth + this.params.letterSpacing
        })
        this.x += this.params.wordSpacing
        n++
      } else {
        div.style.cssText = '--offsetDistance: ' + (80 / (this.params.content.length - 1) * k) + '%;'
        div.innerHTML = ++k
      }
      this.params.container.appendChild(div)
    })

  }
}

  })

  new buildValue({
    container: document.querySelector('.container .spiral-year'),
    splitWords: true,
    parentClass: 'months',
    letterSpacing: -8,
    class: 'month',
    wordSpacing: 15,
    path: pathYears,
    content: Array.from({length: 38}, (_, i) => String(i + 1985))
  })

  new buildValue({
    container: document.querySelector('.container .spiral-value'),
    class: 'value',
    path: path1b,
    content: [
      {
        id: 'day',
        label: '14',
        class: undefined,
      },
      {
        id: 'month',
        label: 'Janvier',
        class: undefined,
      },
      {
        id: 'year',
        label: '2023',
        class: undefined,
      }
    ]
  })
})
